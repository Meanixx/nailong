<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在前往西南科技大学…</title>

<!-- 告诉搜索引擎:真正的内容在目标网站 -->
<link rel="canonical" href="https://www.swust.edu.cn">
<meta name="robots" content="noindex,follow">

<script>
  /* ============================================================
     目标网址:https://www.swust.edu.cn
     以后想换目标,全文搜索 "https://www.swust.edu.cn" 替换成新网址,
     共 4 处,改完保存即可。
     ============================================================ */
  var TARGET = "https://www.swust.edu.cn";

  // 带上原地址尾部的参数(?id=123)和锚点(#top),不丢
  var full = TARGET + window.location.search + window.location.hash;

  // replace 而不是 assign:不留历史记录,按"后退"不会卡在跳转页
  window.location.replace(full);
</script>

<noscript>
  <meta http-equiv="refresh" content="0; url=https://www.swust.edu.cn">
</noscript>

<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:14px;
       font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       color:#333;background:#fafafa}
  .spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:#4a7dff;
           border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{margin:0;font-size:15px}
  a{color:#4a7dff}
</style>
</head>
<body>
  <div class="spinner"></div>
  <p>正在前往西南科技大学…</p>
  <p><a href="https://www.swust.edu.cn">如果 3 秒后没有反应,请点这里</a></p>
</body>
</html>
